name: terraform-ci

# Validates every pull request that touches Terraform.
# Authenticates to GCP with Workload Identity Federation:
# no service account keys are stored in GitHub.

on:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read
  id-token: write # required for keyless WIF auth
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend for validation)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate -no-color

  plan:
    # Plan runs only where WIF is configured; PRs from forks are excluded.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Init
        run: terraform init

      - name: Plan
        run: |
          terraform plan -no-color -input=false \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -out=tfplan

      - name: Post plan summary to the PR
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const plan = execSync('cd terraform && terraform show -no-color tfplan | tail -60').toString();
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan (last 60 lines)\n\`\`\`\n${plan}\n\`\`\``
            });
